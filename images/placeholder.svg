<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f29"/>
      <stop offset="100%" stop-color="#2a1645"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Glowing circle -->
  <circle cx="200" cy="140" r="90" fill="url(#glow)"/>
  
  <!-- String line -->
  <path d="M 50 40 Q 200 90 350 40" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="90" cy="53" r="5" fill="#f43f5e"/>
  <circle cx="150" cy="62" r="6" fill="#10b981"/>
  <circle cx="200" cy="65" r="7" fill="#fbbf24"/>
  <circle cx="250" cy="62" r="6" fill="#3b82f6"/>
  <circle cx="310" cy="53" r="5" fill="#ec4899"/>
  
  <!-- Diya Illustration -->
  <!-- Base -->
  <ellipse cx="200" cy="180" rx="45" ry="16" fill="#d97706"/>
  <path d="M 155 180 Q 200 215 245 180 Z" fill="#b45309"/>
  <!-- Flame glow -->
  <ellipse cx="200" cy="145" rx="18" ry="30" fill="#fbbf24" opacity="0.3" filter="url(#blur)"/>
  <!-- Flame -->
  <path d="M 200 120 Q 212 145 200 162 Q 188 145 200 120 Z" fill="#f59e0b"/>
  <path d="M 200 132 Q 206 148 200 160 Q 194 148 200 132 Z" fill="#fef08a"/>
  
  <!-- Text -->
  <text x="200" y="245" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle">
    ✨ रोशनी दिवाली झालर ✨
  </text>
  <text x="200" y="268" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    प्रीमियम क्वालिटी LED लाइट्स
  </text>
</svg>
